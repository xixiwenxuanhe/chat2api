services:
  chat2api:
    build: .
    image: chat2api:local
    container_name: chat2api
    restart: unless-stopped
    ports:
      - "5005:5005"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # Only expose the OpenAI-compatible API; do not load the ChatGPT web mirror.
      ENABLE_GATEWAY: "false"
      AUTHORIZATION: ${AUTHORIZATION}
      ADMIN_KEY: ${ADMIN_KEY}
      PROXY_URL: ${PROXY_URL}
